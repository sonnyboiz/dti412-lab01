<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}IT Course Portal{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-dark: #080d18;
        --bg-card: #111c2b;
        --pixel-blue: #2878b8;
        --pixel-yellow: #d6b83f;
        --pixel-green: #83b34a;
        --text-light: #e4edf5;
      }

      body {
        background-color: var(--bg-dark);
        background-image:
          linear-gradient(rgba(50, 100, 150, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(50, 100, 150, 0.08) 1px, transparent 1px);
        background-size: 20px 20px;
        color: var(--text-light);
        font-family: "Courier New", monospace;
      }

      .navbar {
        background-color: #050912;
        border-bottom: 3px solid var(--pixel-blue);
      }

      .navbar-brand {
        color: var(--pixel-yellow) !important;
        font-weight: bold;
      }

      .nav-link {
        color: #b8d5ed !important;
      }

      .nav-link:hover {
        color: var(--pixel-yellow) !important;
      }

      .card {
        background-color: var(--bg-card);
        color: var(--text-light);
        border: 2px solid #263e58;
        border-radius: 4px;
      }

      .card-title {
        color: #78baff;
      }

      .text-muted {
        color: #a1b4c7 !important;
      }

      .text-primary {
        color: #78baff !important;
      }

      .btn-primary {
        background-color: var(--pixel-blue);
        border: 2px solid #4a9ce0;
        border-radius: 3px;
        color: white;
      }

      .btn-primary:hover {
        background-color: #1b5f95;
      }

      .btn-outline-primary {
        color: #78baff;
        border: 2px solid var(--pixel-blue);
      }

      .btn-outline-primary:hover {
        background-color: var(--pixel-blue);
        color: white;
      }

      .bg-white {
        background-color: var(--bg-card) !important;
        color: var(--text-light);
      }

      .badge.bg-primary {
        background-color: var(--pixel-blue) !important;
      }

      footer {
        border-top: 3px solid var(--pixel-blue);
      }
    </style>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'catalog:home' %}">
          &gt; IT COURSE PORTAL
        </a>

        <div class="navbar-nav">
          <a class="nav-link" href="{% url 'catalog:home' %}">Home</a>
          <a class="nav-link" href="{% url 'catalog:course_list' %}">Courses</a>
          <a class="nav-link" href="{% url 'catalog:inquiry' %}">Inquiry</a>
        </div>
      </div>
    </nav>

    <main class="container my-4 flex-grow-1">
      {% block content %} {% endblock %}
    </main>

    <footer class="text-center py-3 mt-auto">
      <p class="mb-0 text-muted">IT Course Portal | DTI412</p>
    </footer>
  </body>
</html>
