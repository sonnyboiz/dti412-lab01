{% extends 'catalog/base.html' %} {% block title %}Course List - IT Course
Portal{% endblock %} {% block content %}

<h1 class="mb-4">Available Courses</h1>

<form method="GET" class="mb-4">
  <div class="input-group">
    <input
      type="text"
      name="q"
      class="form-control"
      placeholder="Search by course title or code..."
      value="{{ query }}"
    />

    <button class="btn btn-primary" type="submit">Search</button>
  </div>
</form>

<div class="row g-4">
  {% for course in courses %}
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">{{ course.code }}</h5>

        <p class="card-text">{{ course.title }}</p>

        <a
          href="{% url 'catalog:course_detail' course.id %}"
          class="btn btn-primary"
        >
          View Details
        </a>
      </div>
    </div>
  </div>
  {% empty %}
  <p>No courses found.</p>
  {% endfor %}
</div>

{% endblock %}
